<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap');
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#f8f2e7;color:#1b1b1a;font-family:Montserrat;overflow:hidden;position:relative}
.top{position:absolute;left:80px;right:80px;top:70px;display:flex;justify-content:space-between;align-items:center}
.top img{height:54px}.top b{font-weight:500;letter-spacing:.32em;font-size:20px}
.rub{font-size:20px;letter-spacing:.34em;text-transform:uppercase;color:#8a7a5e}
h1{font-family:'Cormorant Garamond';font-weight:400;line-height:1.02}
h1 em{font-style:italic}
.rule{width:120px;height:1px;background:#c9b48a}
.foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:#6d665b}
.text{position:absolute;left:80px;right:80px;top:330px}
.text h1{font-size:128px;margin:34px 0 44px}
.text p{font-size:30px;line-height:1.6;color:#4a453d;max-width:820px;font-weight:300}
.steps{margin-top:40px;font-size:30px;line-height:1.5;font-weight:300;color:#4a453d}
.steps div{display:grid;grid-template-columns:80px 1fr;padding:22px 0;border-top:1px solid rgba(27,27,26,.15)}
.steps span{color:#c9b48a;font-weight:500;font-size:22px;padding-top:6px;letter-spacing:.1em}
.steps b{font-family:'Cormorant Garamond';font-weight:400;font-size:44px;color:#1b1b1a;display:block;line-height:1.1}
.img{position:absolute;left:0;right:0;top:0;height:860px;background-size:cover;background-position:center}
.row{position:absolute;left:0;right:0;top:0;height:860px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#f8f2e7}
.row div{background-size:cover;background-position:center top}
.band{position:absolute;left:0;right:0;top:860px;bottom:0;padding:58px 80px 0;background:#f8f2e7}
.band h1{font-size:96px;margin-top:22px}
.band.dark{background:#1b1b1a;color:#f8f2e7}.band.dark .rub{color:#c9b48a}
.band.dark ~ .foot{color:#b9ad97}
.dark-body{background:#1b1b1a;color:#f8f2e7}
</style></head><body><div class="img" style="background-image:url(/home/user/moi-web-sait/assets/work/video-peonies.jpg)"></div>
